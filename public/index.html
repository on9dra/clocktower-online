<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>血染鐘樓 · 線上魔典</title>
  <style>
    /* 開屏：跟著 HTML 一起到，不等任何外部文件。夜裏的小鎮，文件每到一個就多亮幾扇窗，全到了鐘響——
       鏡頭拉遠，和底下大廳的小鎮完全重合才揭開，同一片夜空、同一個小鎮上控件一個個出來。小鎮的基準尺寸同 .lobby-town（--w），字標同 .lobby .title */
    html { background: #141826; }
    #boot { --w: max(100vw, 102vh); --zoom: 1.35; position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: linear-gradient(#141826 0%, #232a3f 60%, #2f3550 100%); transition: opacity 1.4s ease; }
    html[data-boot="quiet"] #boot { opacity: 0; transition: opacity .4s; }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot.flush { transition-duration: .35s; } /* 小鎮已經重合，揭開時看不出換了一層 */
    .b-stars { position: absolute; inset: 0; background: url(img/stars.svg) top center / cover; }
    .b-title { --tw: min(420px, 66vw); position: absolute; top: 9vh; left: 50%; width: var(--tw); aspect-ratio: 1461 / 337; transform: translateX(-50%); background: #f4eedf; opacity: 0; transition: opacity .6s;
      -webkit-mask: url(img/art/title-tc-plain.webp) center / contain no-repeat; mask: url(img/art/title-tc-plain.webp) center / contain no-repeat; }
    html[data-lang="sc"] .b-title { aspect-ratio: 1446 / 336; -webkit-mask-image: url(img/art/title-sc-plain.webp); mask-image: url(img/art/title-sc-plain.webp); }
    .named .b-title { opacity: 1; }
    .b-wait { position: absolute; left: 0; right: 0; top: 44vh; text-align: center; color: #f4eedf99; font: 14px serif; letter-spacing: .3em; animation: b-show .4s 15s both; }
    .b-town { position: absolute; left: 50%; bottom: 0; width: var(--w); aspect-ratio: 3 / 1; transform: translateX(-50%) scale(var(--zoom)); transform-origin: 50% 100%; transition: transform 1.5s cubic-bezier(.45, 0, .2, 1); }
    .out .b-town { transform: translateX(-50%); }
    .b-town > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    .b-town svg { overflow: visible; }
    .b-shade { fill: #262d42; transition: opacity .3s .5s; }
    .up .b-shade { opacity: 0; }
    /* 夜景三層圖到齊後從書頁上立起來，遠、中、近依次 */
    .b-town img { opacity: 0; transform-origin: 50% 100%; }
    .up .b-town img { animation: b-up .62s cubic-bezier(.2, .8, .3, 1) both; }
    .up .b-town img:nth-of-type(2) { animation-delay: .13s; }
    .up .b-town img:nth-of-type(3) { animation-delay: .26s; }
    @keyframes b-up { 0% { opacity: 0; transform: perspective(1400px) rotateX(78deg); } 25% { opacity: 1; } 72% { transform: perspective(1400px) rotateX(-7deg); } 100% { opacity: 1; transform: none; } }
    @keyframes b-show { from { opacity: 0; } to { opacity: 1; } }
    /* 窗戶：暗塊蓋住夜景圖裏亮著的窗，亮燈時閃一下暖色，再露出圖裏真的窗 */
    #b-win rect { fill: #1c2232; rx: 2px; transition: fill .16s, opacity .5s .16s; }
    #b-win rect.on { fill: #ffe9ad; opacity: 0; }
    .b-hand { stroke: #2a2622; stroke-width: 3; stroke-linecap: round; transform-origin: 976.5px 594px; transition: transform .12s linear; }
    .b-hour { stroke-width: 4.5; }
    .b-bell { fill: none; stroke: #f4eedf; stroke-width: 2; vector-effect: non-scaling-stroke; opacity: 0; transform-origin: 976.5px 594px; }
    .strike .b-bell { animation: b-bell 1s ease-out both; }
    .strike .b-bell + .b-bell { animation-delay: .22s; }
    @keyframes b-bell { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(22); } }
    @media (max-width: 860px) { #boot { --w: max(100vw, 60vh); --zoom: 2.2; } .b-title { top: 5vh; } }
    @media (prefers-reduced-motion: reduce) { .up .b-town img { animation: b-show .3s both; } .b-town { transition: none; } }
  </style>
  <script>
    // 來過的人回房間（刷新、斷線重連）第一幀就不畫開屏，別耽誤對局；進大廳照常演（放到 body 裏判斷會先閃一下夜景）
    try { if (localStorage.getItem('botc.boot') && /[?&]room=/.test(location.search)) document.documentElement.dataset.boot = 'quiet'; } catch { /* 隱私模式 */ }
  </script>
</head>
<body class="art">
  <div id="app"></div>
  <div id="boot" aria-hidden="true">
    <div class="b-stars"></div>
    <div class="b-title"></div>
    <div class="b-wait">連接中…</div>
    <div class="b-town">
      <svg class="b-shade" viewBox="0 0 2172 724"><path d="M0 724L0 618 12 618 17 602 21 599 31 600 32 608 39 609 50 574 55 570 58 573 69 613 96 614 99 603 106 602 108 598 112 598 114 621 121 622 123 616 133 609 134 602 139 601 141 589 158 589 161 601 186 605 188 595 192 591 203 590 209 595 210 612 214 616 224 616 228 624 234 624 239 616 240 596 247 596 248 602 249 596 252 595 253 601 264 600 265 624 275 624 281 635 287 636 288 612 303 566 304 545 309 539 313 545 314 564 331 612 332 636 334 636 338 624 342 622 343 609 345 607 359 607 360 617 367 618 368 606 371 602 383 601 388 603 389 608 396 611 397 620 402 620 406 614 411 615 415 621 442 620 448 614 449 605 453 605 458 598 466 599 468 605 472 606 476 602 477 583 483 580 492 580 498 584 499 598 562 596 563 575 567 571 574 570 590 574 591 596 600 596 604 585 616 585 619 597 624 599 625 609 631 612 632 618 636 620 637 625 643 631 647 631 657 617 662 617 663 599 670 585 677 559 678 507 680 505 685 507 688 494 692 505 712 505 713 615 718 615 729 580 730 570 734 566 738 570 739 580 751 609 752 618 756 619 768 607 770 599 776 597 778 588 783 587 785 572 802 572 805 575 806 586 870 591 873 583 886 583 888 595 927 635 928 626 931 626 933 560 940 536 941 524 943 521 946 524 952 551 971 498 972 475 977 469 982 475 983 497 1002 551 1007 538 1009 524 1011 521 1013 523 1021 558 1022 629 1024 626 1029 625 1030 610 1035 610 1038 605 1048 605 1051 610 1054 610 1062 604 1068 587 1069 576 1072 572 1076 575 1077 586 1088 618 1093 613 1120 613 1128 582 1132 578 1137 582 1146 613 1153 616 1165 616 1168 604 1184 604 1186 610 1193 614 1199 611 1201 601 1215 600 1217 611 1222 612 1225 617 1235 618 1242 610 1243 576 1248 572 1261 572 1267 575 1270 591 1274 588 1284 590 1287 603 1375 602 1380 609 1381 591 1389 590 1391 598 1393 597 1394 588 1395 596 1402 594 1404 573 1406 571 1424 571 1429 574 1430 587 1433 588 1486 593 1488 585 1502 585 1507 601 1536 634 1538 628 1543 625 1544 613 1548 612 1553 595 1558 588 1563 568 1564 526 1566 524 1568       <img src="img/art/town-far-night.webp" alt="">
      <img src="img/art/town-mid-night.webp" alt="">
      <img src="img/art/town-near-night.webp" alt="">
      <svg viewBox="0 0 2172 724"><g id="b-win"></g><line class="b-hand b-hour" x1="976.5" y1="594" x2="976.5" y2="579"/><line class="b-hand b-min" x1="976.5" y1="594" x2="976.5" y2="570"/><circle class="b-bell" cx="976.5" cy="594" r="34"/><circle class="b-bell" cx="976.5" cy="594" r="34"/></svg>
    </div>
  </div>
  <script>
    // 開屏：樣式表和對局要用的圖在這裏拉回來（app.js 等 boot.css），app 第一屏畫好時調 boot.ready()。
    // 樣式表用 preload 拉，不擋第一次繪製，到了再生效。回房間的老玩家文件都在緩存裏，不演開屏；2 秒還沒好才亮出來
    // 開屏揭開時 boot.out 兌現，大廳的控件、介紹的牌等它才出來
    {
      const root = document.documentElement, el = document.getElementById('boot'), minHand = el.querySelector('.b-min'), hourHand = el.querySelector('.b-hour');
      const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: k => { try { localStorage.setItem(k, '1'); } catch { /* 隱私模式 */ } } };
      const lang = store.get('botc.lang') || 'tc';
      root.dataset.lang = lang;
      if (lang === 'sc') el.querySelector('.b-wait').textContent = '连接中…';
      const CSS = ['style', 'board', 'fx', 'hud', 'party', 'help', 'intro', 'about', 'art', 'night', 'ambient'];
      const MUST = ['table-day', 'table-night', 'card-frame', 'seat-empty', 'plate', 'plate-evil', 'stamp-mask', 'town-near-day', 'town-mid-day', 'town-far-day'];
      const LATER = ['card-wear', 'curtain-drape', 'curtain-valance', 'card-back', 'sun', 'moon', 'gallows-wood', 'gallows-noose', 'crown-good', 'crown-evil', 'egg', 'egg-splat-1', 'egg-splat-2', 'egg-splat-3', 'mvp-medal', 'trophy'];
      // 窗戶 x, y, 寬, 高（art-src/boot-town.py 從夜景圖算出來的），從鐘樓往兩邊亮
      const WINDOWS = [20,641,9,12,36,665,7,13,81,675,7,13,90,641,4,13,97,677,7,12,119,676,7,11,146,626,8,12,166,655,10,15,217,640,4,10,220,673,6,10,263,673,5,10,271,651,4,12,280,672,4,9,303,624,6,14,333,672,8,12,347,647,9,10,363,672,9,13,364,695,4,11,406,681,5,12,419,682,4,11,430,680,7,8,458,631,8,14,475,656,5,9,515,669,10,14,531,629,7,15,542,668,10,15,593,655,5,15,608,628,8,14,656,679,7,12,672,676,5,11,675,608,7,9,697,609,6,7,730,644,10,14,773,650,10,19,788,616,10,15,808,650,12,21,863,662,8,13,869,624,7,14,883,664,5,10,901,663,6,13,961,639,7,26,972,685,13,20,974,636,8,29,988,640,7,25,1073,680,9,13,1105,680,10,13,1112,641,9,13,1151,680,11,12,1203,641,11,14,1267,677,5,9,1269,644,5,11,1288,677,4,9,1355,666,7,18,1369,641,6,13,1384,666,8,11,1411,618,9,13,1433,649,7,17,1477,659,9,16,1481,620,13,15,1503,659,9,16,1536,674,4,12,1547,651,8,12,1562,675,7,13,1581,615,5,9,1605,685,11,12,1635,685,5,8,1645,611,7,14,1666,612,4,13,1678,682,6,13,1737,656,13,16,1760,671,6,9,1800,651,9,13,1800,683,7,11,1828,683,6,11,1838,624,9,13,1897,662,6,11,1910,663,5,8,1946,666,5,9,1955,646,7,11,1978,644,9,15,1991,668,9,15,2038,678,10,10,2071,643,10,21,2073,597,8,13,2117,648,4,11,2155,655,5,16];
      // 放大後跑出屏幕的窗戶直接算亮的（天亮拉遠時已經亮著），進度只看屏幕裏的
      const win = document.getElementById('b-win'), box = win.closest('svg').getBoundingClientRect(), lamps = [];
      for (let i = 0; i < WINDOWS.length; i += 4) {
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect'), x = box.left + WINDOWS[i] * box.width / 2172;
        ['x', 'y', 'width', 'height'].forEach((k, j) => r.setAttribute(k, WINDOWS[i + j]));
        win.append(r);
        if (x < 0 || x > innerWidth) r.classList.add('on');
        else lamps.push([Math.abs(WINDOWS[i] - 976) + Math.random() * 260, r]);
      }
      lamps.sort((a, b) => a[0] - b[0]);

      const APP = 8; // 第一屏畫好抵幾個文件（要等 JS 下完、連上服務器）
      const all = CSS.length + MUST.length + 1 + APP;
      const MIN = 1200; // 開屏至少演這麼久（從小鎮立起來算）：窗一扇扇亮完要這麼久，文件到得再快也不快進
      // 鐘針轉到現在的時間，揭開時接上大廳小鎮上走著真時間的鐘針
      const now = new Date(), toMin = 360 + now.getMinutes() * 6, toHour = 360 + now.getHours() % 12 * 30 + now.getMinutes() / 2;
      let left = all - APP, app = false, art = false, t0 = 0, lit = 0, quiet = !!root.dataset.boot, handed;
      const out = new Promise(ok => { handed = ok; });
      const got = () => { left--; };
      const load = (name, cb) => { const i = new Image(); i.onload = i.onerror = cb; i.src = `img/art/${name}.webp`; };
      const start = () => { if (!art) { art = true; t0 = performance.now(); } };
      const end = () => {
        clearInterval(clock);
        store.set('botc.boot');
        if (quiet) { handed(); return el.remove(); }
        el.classList.add('strike');
        setTimeout(pull, 380);
      };
      // 鏡頭拉遠：落點量的是底下小鎮的實際位置和大小（窗口矮時大廳會滾動、多一條滾動條），拉到位兩層小鎮完全重合，這時揭開只多出控件。
      // 直接進房間的底下沒有這個小鎮，慢慢淡掉
      const pull = () => {
        const goal = document.querySelector('.intro .lobby-town') || document.querySelector('.lobby .lobby-town'), town = el.querySelector('.b-town');
        if (!goal) {
          el.classList.add('out');
          handed();
          return setTimeout(() => el.remove(), 1500);
        }
        const r = goal.getBoundingClientRect(), s = Math.max(r.width, r.height * 3) / town.offsetWidth;
        town.style.transform = `translate(calc(-50% + ${r.left + r.width / 2 - el.clientWidth / 2}px), ${r.bottom - el.clientHeight}px) scale(${s})`;
        setTimeout(() => {
          el.classList.add('flush', 'out');
          handed();
          setTimeout(() => el.remove(), 400);
        }, document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1500);
      };
      const clock = setInterval(() => {
        const ready = left <= 0 && app;
        if (quiet) return ready && end();
        const played = art ? (performance.now() - t0) / MIN : 0;
        const want = art ? Math.ceil(lamps.length * Math.min(played, ready ? 1 : (all - Math.max(left, 0) - (app ? 0 : APP)) / all)) : 0;
        for (let n = ready ? 4 : 1; n-- && lit < want;) lamps[lit++][1].classList.add('on');
        const p = lit / lamps.length;
        minHand.style.transform = `rotate(${p * toMin}deg)`;
        hourHand.style.transform = `rotate(${p * toHour}deg)`;
        if (ready && (document.hidden || (played >= 1 && lit === lamps.length))) end();
      }, 18);
      window.boot = {
        out,
        ready() { app = true; },
        css: Promise.all(CSS.map(n => new Promise(ok => {
          const l = document.createElement('link');
          l.rel = 'preload'; l.as = 'style'; l.href = `css/${n}.css`;
          l.onload = () => { l.onload = () => { got(); ok(); }; l.rel = 'stylesheet'; };
          l.onerror = () => { got(); ok(); };
          document.head.append(l);
        }))),
      };
      if (quiet) setTimeout(() => { quiet = false; delete root.dataset.boot; }, 2000);
      Promise.all([...el.querySelectorAll('img')].map(i => i.decode().catch(() => {}))).then(() => { start(); el.classList.add('up'); });
      setTimeout(start, 4000);
      setTimeout(() => { left = 0; }, 12000); // 圖片卡住也別一直攔著
      load(`title-${lang}-plain`, () => { got(); el.classList.add('named'); });
      Promise.all(MUST.map(n => new Promise(ok => load(n, () => { got(); ok(); })))).then(() => LATER.forEach(n => load(n)));
    }
  </script>
  <script defer src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
