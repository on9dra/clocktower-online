  <style>
    /* 開屏：跟著 HTML 一起到，不等任何外部文件。夜裏的小鎮，文件每到一個就多亮幾扇窗，全到了鐘響——
       鏡頭拉遠，和底下大廳的小鎮完全重合才揭開，同一片夜空、同一個小鎮上控件一個個出來。小鎮的基準尺寸同 .lobby-town（--w），字標同 .lobby .title */
    html { background: #141826; }
    #boot { --w: max(100vw, 102vh); --zoom: 1.35; position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: linear-gradient(#141826 0%, #232a3f 60%, #2f3550 100%); transition: opacity 1.4s ease; }
    html[data-boot="quiet"] #boot { opacity: 0; transition: opacity .4s; }
    html[data-boot="quiet"] body { visibility: hidden; } /* 回房間：桌面畫好再一起淡入，不一塊塊蹦出來 */
    #boot.out { opacity: 0; pointer-events: none; }
    #boot.flush { transition-duration: .35s; } /* 小鎮已經重合，揭開時看不出換了一層 */
    .b-stars { position: absolute; inset: 0; background: url(img/stars.svg) top center / cover; opacity: 0; transition: opacity .8s; }
    .starry .b-stars { opacity: 1; }
    .b-title { --tw: min(420px, 66vw); position: absolute; top: 9vh; left: 50%; width: var(--tw); aspect-ratio: 1446 / 336; transform: translateX(-50%); background: #f4eedf; opacity: 0; transition: opacity .6s;
      -webkit-mask: url(img/art/title-sc-plain.webp) center / contain no-repeat; mask: url(img/art/title-sc-plain.webp) center / contain no-repeat; }
    html[data-lang="tc"] .b-title { aspect-ratio: 1461 / 337; -webkit-mask-image: url(img/art/title-tc-plain.webp); mask-image: url(img/art/title-tc-plain.webp); }
    .named .b-title { opacity: 1; }
    .b-wait { position: absolute; left: 0; right: 0; top: 44vh; text-align: center; color: #f4eedf99; font: 14px serif; letter-spacing: .3em; opacity: 0; transition: opacity .4s; }
    .slow .b-wait { opacity: 1; }
    /* 點擊進入：瀏覽器要用戶點過才讓出聲，開屏停在這裏等一下。一行字慢慢呼吸，點了淡掉，鐘接著響 */
    .b-go { position: absolute; left: 0; right: 0; top: 44vh; text-align: center; color: #f4eedf; font: 700 22px var(--serif, serif); letter-spacing: .5em; padding-left: .5em; opacity: 0; transition: opacity .7s; pointer-events: none; }
    .b-go span { animation: b-breathe 2.4s ease-in-out infinite alternate; }
    .gate { cursor: pointer; }
    .gate .b-go { opacity: 1; }
    @keyframes b-breathe { to { opacity: .6; } }
    /* 起不來（瀏覽器太舊、文件沒下完、出錯）：小鎮上說一句，下面兩個字的按鈕；複製不了就把鏈接擺出來選好，長按自己複製 */
    .b-note { position: absolute; z-index: 2; left: 16px; right: 16px; top: 44vh; display: grid; justify-items: center; gap: 10px; color: #f4eedf; text-align: center;
      opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease, visibility 0s .6s; }
    .fail .b-note { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .fail .b-wait, .fail .b-go { opacity: 0; }
    .b-note p { margin: 0; font: 700 20px var(--serif, serif); letter-spacing: .4em; padding-left: .4em; }
    .b-note span { display: flex; gap: 26px; }
    .b-note button { padding: 8px 0 5px .3em; color: inherit; background: none; border: 0; border-bottom: 1px solid #f4eedf80; font: 15px var(--serif, serif); letter-spacing: .3em; cursor: pointer; }
    .b-note button:hover { border-bottom-color: #f4eedf; }
    .old .b-retry { display: none; }
    #boot .b-note input { display: none; width: min(100%, 440px); padding: 6px 4px; color: #f4eedf; background: none; border: 0; border-bottom: 1px dashed #f4eedf80; border-radius: 0; outline: 0; font: 13px monospace; text-align: center; }
    #boot.hand .b-note input { display: block; animation: b-show .4s both; }
    .b-town { position: absolute; left: 50%; bottom: 0; width: var(--w); aspect-ratio: 3 / 1; transform: translateX(-50%) scale(var(--zoom)); transform-origin: 50% 100%; transition: transform 1.5s cubic-bezier(.45, 0, .2, 1); }
    .out .b-town { transform: translateX(-50%); }
    .b-town > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    .b-town svg { overflow: visible; }
    .b-shade { fill: #262d42; transition: opacity .3s .5s; }
    .up .b-shade { opacity: 0; }
    /* 夜景三層圖到齊後從書頁上立起來，遠、中、近依次 */
    .b-town img { opacity: 0; transform-origin: 50% 100%; }
    .up .b-town img { animation: b-up .62s cubic-bezier(.2, .8, .3, 1) both; }
    .up .b-town img:nth-of-type(2) { animation-delay: .13s; }
    .up .b-town img:nth-of-type(3) { animation-delay: .26s; }
    @keyframes b-up { 0% { opacity: 0; transform: perspective(1400px) rotateX(78deg); } 25% { opacity: 1; } 72% { transform: perspective(1400px) rotateX(-7deg); } 100% { opacity: 1; transform: none; } }
    @keyframes b-show { from { opacity: 0; } to { opacity: 1; } }
    /* 窗戶：暗塊蓋住夜景圖裏亮著的窗，亮燈時閃一下暖色，再露出圖裏真的窗 */
    #b-win rect { fill: #1c2232; rx: 2px; transition: fill .16s, opacity .5s .16s; }
    #b-win rect.on { fill: #ffe9ad; opacity: 0; }
    .b-hand { stroke: #2a2622; stroke-width: 3; stroke-linecap: round; transform-origin: 976.5px 594px; transition: transform .12s linear; }
    .b-hour { stroke-width: 4.5; }
    .b-bell { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    @media (max-width: 860px) { #boot { --w: max(100vw, 60vh); --zoom: 2.2; } .b-title { top: 5vh; } }
    @media (prefers-reduced-motion: reduce) { .up .b-town img { animation: b-show .3s both; } .b-town { transition: none; } .b-go span { animation: none; } }

  <script>
    // 守門：瀏覽器太舊、文件沒下下來、app 起不來時，開屏不再一聲不響地停著——小鎮上說一句，給「重試」和「複製鏈接」（拿到別的瀏覽器打開）。
    // 只用最老的寫法（var、function）：太舊的瀏覽器解析不了後面的開屏和 app.js，這段也得跑起來。開屏調 expect / ready / done 告訴它走到哪了
    (function () {
      var root = document.documentElement, el = document.getElementById('boot'), note = el.querySelector('.b-note'), copyBtn = note.querySelector('.b-copy'), t0 = Date.now(), tc = false;
      try { tc = localStorage.getItem('botc.lang') === 'tc'; } catch (e) { /* 隱私模式 */ }
      var say = tc ? { old: '瀏覽器版本太舊', load: '沒有載入完成', retry: '重試', copy: '複製鏈接', copied: '已複製', url: '鏈接' }
        : { old: '浏览器版本太旧', load: '没有载入完成', retry: '重试', copy: '复制链接', copied: '已复制', url: '链接' };
      note.querySelector('.b-retry').textContent = say.retry;
      copyBtn.textContent = say.copy;
      note.querySelector('input').setAttribute('aria-label', say.url);
      // app 要的：頂層 await、.at()、findLastIndex（ES2022 前後），CSS 容器查詢和 :has()——圓桌的大小、位置全靠這兩樣，沒有就縮成一團
      var old = !([].at && [].findLastIndex && window.CSS && CSS.supports && CSS.supports('container-type: inline-size') && CSS.supports('selector(:has(a))'));
      // kind：正在說的那句；hard：文件沒下下來、瀏覽器太舊，只能重試 / 換瀏覽器；只是等太久的，app 後來起來了就收回去接著演
      var kind = null, hard = old, ready = false, done = false, due = 0, seen = -1, moved = t0;
      function fail(k, firm) {
        if (done) return;
        if (firm) hard = true;
        if (kind === 'old' || kind === k) return;
        kind = k;
        note.querySelector('p').textContent = say[k];
        el.classList.add('fail');
        el.classList.toggle('old', k === 'old');
        el.removeAttribute('aria-hidden');
        root.style.overflow = 'hidden'; // 底下畫了一半的大廳別帶出滾動條
        delete root.dataset.boot; // 回房間時開屏是藏著的，拿出來
      }
      // 腳本、樣式表、預載的模塊下不來：app 起不來，直接說。自己的腳本拋錯（模塊解析不了、app.js 頂層出錯）：給它一秒半，還沒起來再說
      addEventListener('error', function (e) {
        if (done || ready) return;
        var t = e.target;
        if (t && t.tagName) { if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /stylesheet|preload/.test(t.rel))) fail('load', true); return; }
        if (!e.filename || e.filename.indexOf(location.origin) !== 0) return; // 瀏覽器插件之類
        setTimeout(function () { if (!ready) fail('load'); }, 1500);
      }, true);
      // 等太久：開屏自己的圖到齊（或者 12 秒，到點開屏也不再等圖）之後再 22 秒，app 還沒起來，而且最近 8 秒一個文件也沒到（網慢但還在下的不算；
      // socket.io 連不上時一直重試的請求不算到了文件）
      var tick = setInterval(function () {
        if (done) return clearInterval(tick);
        var now = Date.now(), list = performance.getEntriesByType ? performance.getEntriesByType('resource') : [], n = 0;
        for (var i = 0; i < list.length; i++) if (list[i].name.indexOf('/socket.io/?') < 0) n++;
        if (n !== seen) { seen = n; moved = now; }
        if (old) {
          if (now - t0 < 1500 && !el.classList.contains('up')) return; // 等小鎮立起來再說
          el.classList.add('up', 'named', 'starry'); // 後面的開屏解析不了的老瀏覽器：小鎮自己立起來
          fail('old', true);
          return clearInterval(tick);
        }
        if (!ready && now > (due || t0 + 12000) + 22000 && now - moved > 8000) fail('load');
      }, 500);
      note.querySelector('.b-retry').onclick = function () { location.reload(); };
      // 複製當前地址：http 頁面沒有 navigator.clipboard，退回 execCommand；都不行就把鏈接擺出來選好
      copyBtn.onclick = function () {
        var url = location.href, input = note.querySelector('input');
        var ok = function () { copyBtn.textContent = say.copied; setTimeout(function () { copyBtn.textContent = say.copy; }, 2000); };
        var by = function () {
          var ta = document.createElement('textarea'), copied = false;
          ta.value = url; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0';
          document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, url.length);
          try { copied = document.execCommand('copy'); } catch (e) { /* 不支持 */ }
          document.body.removeChild(ta);
          if (copied) return ok();
          input.value = url; el.classList.add('hand'); input.focus(); input.select(); input.setSelectionRange(0, url.length);
        };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(ok, by); else by();
      };
      window.bootGuard = {
        blocked: function () { return hard; },
        expect: function () { if (!due) due = Date.now(); },
        ready: function () { ready = true; if (kind && !hard) { kind = null; el.classList.remove('fail'); el.setAttribute('aria-hidden', 'true'); root.style.overflow = ''; } },
        done: function () { done = true; },
      };
    })();
  </script>
  <script>
    // 開屏：樣式表和對局要用的圖在這裏拉回來（app.js 等 boot.css），app 第一屏畫好時調 boot.ready()。
    // 樣式表用 preload 拉，不擋第一次繪製，到了再生效。回房間的老玩家文件都在緩存裏，不演開屏；2 秒還沒好才亮出來
    // 開屏揭開時 boot.out 兌現，大廳的控件、介紹的牌等它才出來。
    // 這段只用 ES2017（沒有 ?.、??、省略參數的 catch）：老一點的瀏覽器也要能解析，守門的那句話才有小鎮墊著
    {
      const root = document.documentElement, el = document.getElementById('boot'), minHand = el.querySelector('.b-min'), hourHand = el.querySelector('.b-hour'), guard = window.bootGuard;
      const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: k => { try { localStorage.setItem(k, '1'); } catch (e) { /* 隱私模式 */ } } };
      const lang = store.get('botc.lang') || 'sc';

      if (lang === 'tc') { el.querySelector('.b-wait').textContent = '連接中…'; el.querySelector('.b-go span').textContent = '點擊進入'; document.title = '血染鐘樓 · 線上魔典'; }
      const CSS = ['style', 'board', 'fx', 'hud', 'party', 'help', 'intro', 'print', 'about', 'art', 'night', 'ambient'];
      // 服務器只有 2Mbps 上下，開屏只等第一屏用得到的：進大廳不用等桌面的圖；點邀請鏈接直接進房間才等

      const inRoom = /[?&]room=/.test(location.search), MUST = inRoom ? [...LOBBY, ...GAME] : LOBBY;
      const LATER = ['curtain-drape', 'curtain-valance', 'card-back', 'sun', 'moon', 'gallows-wood', 'gallows-noose', 'crown-good', 'crown-evil', 'egg', 'egg-splat-1', 'egg-splat-2', 'egg-splat-3', 'mvp-medal', 'trophy', ...['block', 'rule-thin', 'rule-mid', 'rule-wenwu', 'rule-thin-v', 'rule-dash', 'perf'].map(n => `../press/${n}`)];
      // 窗戶 x, y, 寬, 高（art-src/boot-town.py 從夜景圖算出來的），從鐘樓往兩邊亮
      const WINDOWS = [20,641,9,12,36,665,7,13,81,675,7,13,90,641,4,13,97,677,7,12,119,676,7,11,146,626,8,12,166,655,10,15,217,640,4,10,220,673,6,10,263,673,5,10,271,651,4,12,280,672,4,9,303,624,6,14,333,672,8,12,347,647,9,10,363,672,9,13,364,695,4,11,406,681,5,12,419,682,4,11,430,680,7,8,458,631,8,14,475,656,5,9,515,669,10,14,531,629,7,15,542,668,10,15,593,655,5,15,608,628,8,14,656,679,7,12,672,676,5,11,675,608,7,9,697,609,6,7,730,644,10,14,773,650,10,19,788,616,10,15,808,650,12,21,863,662,8,13,869,624,7,14,883,664,5,10,901,663,6,13,961,639,7,26,972,685,13,20,974,636,8,29,988,640,7,25,1073,680,9,13,1105,680,10,13,1112,641,9,13,1151,680,11,12,1203,641,11,14,1267,677,5,9,1269,644,5,11,1288,677,4,9,1355,666,7,18,1369,641,6,13,1384,666,8,11,1411,618,9,13,1433,649,7,17,1477,659,9,16,1481,620,13,15,1503,659,9,16,1536,674,4,12,1547,651,8,12,1562,675,7,13,1581,615,5,9,1605,685,11,12,1635,685,5,8,1645,611,7,14,1666,612,4,13,1678,682,6,13,1737,656,13,16,1760,671,6,9,1800,651,9,13,1800,683,7,11,1828,683,6,11,1838,624,9,13,1897,662,6,11,1910,663,5,8,1946,666,5,9,1955,646,7,11,1978,644,9,15,1991,668,9,15,2038,678,10,10,2071,643,10,21,2073,597,8,13,2117,648,4,11,2155,655,5,16];
      // 放大後跑出屏幕的窗戶直接算亮的（天亮拉遠時已經亮著），進度只看屏幕裏的
      const win = document.getElementById('b-win'), box = win.closest('svg').getBoundingClientRect(), lamps = [];
      for (let i = 0; i < WINDOWS.length; i += 4) {
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect'), x = box.left + WINDOWS[i] * box.width / 2172;
        ['x', 'y', 'width', 'height'].forEach((k, j) => r.setAttribute(k, WINDOWS[i + j]));
        win.append(r);
        if (x < 0 || x > innerWidth) r.classList.add('on');
        else lamps.push([Math.abs(WINDOWS[i] - 976) + Math.random() * 260, r]);
      }
      lamps.sort((a, b) => a[0] - b[0]);

      const APP = 8; // 第一屏畫好抵幾個文件（要等 JS 下完、連上服務器）
      const all = CSS.length + MUST.length + 2 + APP; // 2：字標、星空
      const MIN = 1200; // 開屏至少演這麼久（從小鎮立起來算）：窗一扇扇亮完要這麼久，文件到得再快也不快進
      const BEAT = .9; // 鐘響兩下隔多久，同 sfx.js 的 night
      // 鐘針轉到現在的時間，揭開時接上大廳小鎮上走著真時間的鐘針
      const now = new Date(), toMin = 360 + now.getMinutes() * 6, toHour = 360 + now.getHours() % 12 * 30 + now.getMinutes() / 2;
      let left = all - APP, app = false, art = false, t0 = 0, lit = 0, quiet = !!root.dataset.boot, handed;
      const loud = !quiet; // 回房間的人哪怕等久了亮出開屏也不敲：局裏這一聲就是入夜
      const out = new Promise(ok => { handed = ok; });
      const got = () => { left--; };
      const load = (name, cb) => { const i = new Image(); i.onload = i.onerror = cb; i.src = `img/art/${name}.webp`; return i; };
      // 小鎮和字標到了之後，JS 一次全列出來並行拉，不用一層層解析 import：香港線路一個往返 270ms，七層就是兩秒。
      // 等它們到了再拉：不搶開屏第一眼那幾張圖的帶寬。名單由 tests/preload.test.js 對著 import 核對
      let pulled = false, first = 2;
      const pullJs = () => { if (pulled || guard.blocked()) return; pulled = true; for (const n of 'app ui roompass roles community icons lang t2s town side log manual glyph gamelog fx ambient tactile sfx bgm fireworks score scores hud trial flow setup infoform infofmt stepcard invite topbar settings about author progress egg lobby intro press'.split(' ')) document.head.append(Object.assign(document.createElement('link'), { rel: 'modulepreload', href: `js/${n}.js` })); };
      const firstArt = () => { if (!--first) pullJs(); };
      const start = () => { if (!art) { art = true; t0 = performance.now(); } };
      const end = () => {
        clearInterval(clock);
        guard.done();
        el.classList.remove('slow');
        store.set('botc.boot');
        more();
        if (quiet) {
          handed(); el.remove();
          // 桌面第一幀要畫一陣子，淡入等它畫完才開始，不然還沒看到就演完了
          const fade = document.body.animate({ opacity: [0, 1] }, { duration: 500, easing: 'ease-in-out' });
          fade.pause();
          delete root.dataset.boot;
          return requestAnimationFrame(() => requestAnimationFrame(() => fade.play()));
        }
        // 瀏覽器要用戶點過才讓出聲：進大廳時停在小鎮上等一下。能出聲（切繁簡、離開房間的刷新）、靜音的不用等，邀請鏈接直接進房間也不等
        if (!inRoom && window.boot.locked && window.boot.locked()) gate(); else strike(250);
      };
      const gate = () => {
        el.classList.add('gate');
        const go = e => {
          if (e.key && e.key !== ' ') return;
          e.preventDefault(); e.stopPropagation(); // 底下的介紹也聽鍵盤
          el.removeEventListener('click', go);
          removeEventListener('keydown', go, true);
          el.classList.remove('gate');
          strike(1500); // 點過了瀏覽器一定放行，只是聲卡起來要一會兒
        };
        el.addEventListener('click', go);
        addEventListener('keydown', go, true);
      };
      const strike = async wait => {
        if (!document.hidden) {
          if (loud && window.boot.chime) await window.boot.chime(wait);
          if (bell && !matchMedia('(prefers-reduced-motion: reduce)').matches) bell();
        }
        setTimeout(pull, BEAT * 1000); // 第二下鐘響時鏡頭開始拉遠
      };
      // 鐘聲：入夜的「咚、咚」兩下，音波也是兩下。不畫圈。透明的聲波從鐘樓掃過去，波經過的地方夜空、小鎮、字標被折射（按位移重新取樣），只帶一點點亮邊；
      // 波以外的畫布全透明，看到的就是底下真的畫面。拉鏡頭時每幀量小鎮的實際位置，折射出來的小鎮和底下對得上。
      // 小鎮立起來時先把著色器和小鎮貼圖備好，鐘響那一刻不卡；夜空到鐘響才畫（要等字標）
      const FRAG = `#ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform sampler2D sky, town; uniform vec2 S, C, R, A, W, Q; uniform vec4 B; uniform float T; varying vec2 v;
        vec3 at(vec2 p) { vec4 t = texture2D(town, (p - B.xy) / B.zw); return t.rgb + texture2D(sky, p / S).rgb * (1. - t.a); }
        // 一道波：一鼓一縮，前沿陡、身後緩。x 是位移，y 是極淡的明暗
        vec2 wave(float d, float r, float w, float a) { float x = (d - r) / w, e = x > 0. ? exp(-x * x * 3.) : exp(x * 1.5); return a * e * vec2(sin(x * 3.6), cos(x * 3.6)); }
        void main() {
          vec2 p = v * S, o = p - C;
          float d = length(o), th = atan(o.y, o.x), dd = d * (1. + .02 * sin(th * 3. + 1.) + .012 * sin(th * 7. - T * 2.));
          // 波前不是一整圈：有的方向強、有的方向幾乎沒有，看不出圓環
          float side = max(0., .62 + .26 * sin(th * 3. + 1.3 + d * .004) + .18 * sin(th * 5. - .7 - d * .006) + .12 * sin(th * 11. + T * 1.7));
          vec2 f = (wave(dd, R.x, W.x, A.x) + wave(dd, R.y, W.y, A.y)) * side;
          // 每道波過去之後空氣還顫一會兒
          float air = smoothstep(0., 160., R.x - dd) * Q.x + smoothstep(0., 160., R.y - dd) * Q.y;
          float m = max(smoothstep(0., .7, length(f)), smoothstep(0., .5, air));
          if (m < .004) discard;
          vec2 q = o / max(d, 1.) * f.x + air * vec2(sin(p.y * .043 + T * 7.) + sin(p.x * .019 - T * 4.), sin(p.x * .037 - T * 6.) + sin(p.y * .023 + T * 3.)) * .5;
          // 沿位移方向取五次，紅藍散開一點：星星被拉成細絲，不是重影
          vec3 c = (at(p - q * .78) * vec3(.42, .08, 0.) + at(p - q * .89) * vec3(.38, .24, .06) + at(p - q) * vec3(.16, .36, .16)
            + at(p - q * 1.11) * vec3(.04, .24, .38) + at(p - q * 1.22) * vec3(0., .08, .4)) + f.y * side / (1. + abs(f.y) * .14) * vec3(.003, .0032, .004);
          gl_FragColor = vec4(c * m, m);
        }`;
      const WAVES = [[0, 1], [BEAT, .72]]; // 第幾秒出發、力度：和兩記鐘聲同拍，輕重也一樣
      let bell;
      const arm = () => {
        const cv = document.createElement('canvas'), gl = cv.getContext('webgl', { antialias: false, depth: false, stencil: false });
        if (!gl) return;
        cv.className = 'b-bell';
        const prog = gl.createProgram();
        [[gl.VERTEX_SHADER, 'attribute vec2 a; varying vec2 v; void main() { v = vec2(a.x * .5 + .5, .5 - a.y * .5); gl_Position = vec4(a, 0., 1.); }'], [gl.FRAGMENT_SHADER, FRAG]].forEach(([type, src]) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s); gl.attachShader(prog, s);
        });
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        const U = n => gl.getUniformLocation(prog, n);
        const tex = (unit, src) => {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
          [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([k, x]) => gl.texParameteri(gl.TEXTURE_2D, k, x));
          gl.uniform1i(U(unit ? 'sky' : 'town'), unit);
        };
        const paper = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
        // 小鎮：三層夜景 + 鐘針（已經走到現在的時間）
        const [tc, t] = paper(2172, 724);
        el.querySelectorAll('.b-town img').forEach(i => t.drawImage(i, 0, 0, 2172, 724));
        t.strokeStyle = '#2a2622'; t.lineCap = 'round'; t.translate(976.5, 594);
        [[toMin, 24, 3], [toHour, 15, 4.5]].forEach(([deg, len, wid]) => {
          t.save(); t.rotate(deg * Math.PI / 180); t.lineWidth = wid; t.beginPath(); t.moveTo(0, 0); t.lineTo(0, -len); t.stroke(); t.restore();
        });
        tex(0, tc);
        gl.drawArrays(gl.TRIANGLES, 0, 3); // 先畫一次：有的顯卡驅動第一次畫才真正編譯著色器
        bell = () => {
          const W = el.clientWidth, H = el.clientHeight, k = Math.min(devicePixelRatio || 1, 2), town = el.querySelector('.b-town');
          cv.width = W * k; cv.height = H * k;
          gl.viewport(0, 0, cv.width, cv.height);
          // 夜空：漸變 + 星星（cover，靠上居中）+ 字標，和底下一樣的位置
          const [sc, s] = paper(cv.width, cv.height), g = s.createLinearGradient(0, 0, 0, cv.height), box = el.querySelector('.b-title').getBoundingClientRect();
          [[0, '#141826'], [.6, '#232a3f'], [1, '#2f3550']].forEach(([at, c]) => g.addColorStop(at, c));
          s.fillStyle = g; s.fillRect(0, 0, cv.width, cv.height);
          if (stars.naturalWidth) { const z = Math.max(cv.width / 1600, cv.height / 700); s.drawImage(stars, (cv.width - 1600 * z) / 2, 0, 1600 * z, 700 * z); }
          if (title.naturalWidth) {
            const [nc, n] = paper(title.naturalWidth, title.naturalHeight);
            n.drawImage(title, 0, 0); n.globalCompositeOperation = 'source-in'; n.fillStyle = '#f4eedf'; n.fillRect(0, 0, nc.width, nc.height);
            s.drawImage(nc, box.left * k, box.top * k, box.width * k, box.height * k);
          }
          tex(1, sc);
          gl.uniform2f(U('S'), W, H);
          const uB = U('B'), uC = U('C'), uR = U('R'), uA = U('A'), uW = U('W'), uQ = U('Q'), uT = U('T'), far = Math.hypot(W, H), big = Math.min(1, far / 1400) * 26, at0 = performance.now();
          el.append(cv);
          const frame = now => {
            const T = Math.max(0, now - at0) / 1000;
            if (T > 3 || !el.isConnected) return cv.remove();
            const b = town.getBoundingClientRect(), r = [], a = [], w = [], q = [];
            WAVES.forEach(([from, power]) => {
              const dt = T - from, rad = dt > 0 ? 26 + far * .62 * dt : -500;
              r.push(rad); w.push(60 + rad * .1);
              a.push(dt > 0 ? power * big * Math.min(1, dt * 7) * Math.exp(-dt * 1.1) / Math.sqrt(1 + rad / 320) : 0);
              q.push(dt > 0 ? power * 2 * Math.exp(-dt * 1.7) : 0);
            });
            gl.uniform4f(uB, b.left, b.top, b.width, b.height);
            gl.uniform2f(uC, b.left + b.width * 976.5 / 2172, b.top + b.height * 594 / 724);
            gl.uniform2fv(uR, r); gl.uniform2fv(uA, a); gl.uniform2fv(uW, w); gl.uniform2fv(uQ, q);
            gl.uniform1f(uT, T);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(frame);
          };
          frame(at0);
        };
      };
      // 鏡頭拉遠：落點量的是底下小鎮的實際位置和大小（窗口矮時大廳會滾動、多一條滾動條），拉到位兩層小鎮完全重合，這時揭開只多出控件。
      // 直接進房間的底下沒有這個小鎮，慢慢淡掉
      const pull = () => {
        const goal = document.querySelector('.intro .lobby-town') || document.querySelector('.lobby .lobby-town'), town = el.querySelector('.b-town');
        if (!goal) {
          el.classList.add('out');
          handed();
          return setTimeout(() => el.remove(), 1500);
        }
        const r = goal.getBoundingClientRect(), s = Math.max(r.width, r.height * 3) / town.offsetWidth;
        town.style.transform = `translate(calc(-50% + ${r.left + r.width / 2 - el.clientWidth / 2}px), ${r.bottom - el.clientHeight}px) scale(${s})`;
        setTimeout(() => {
          el.classList.add('flush', 'out');
          handed();
          setTimeout(() => el.remove(), 400);
        }, document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1500);
      };
      const clock = setInterval(() => {
        if (left <= 0) guard.expect(); // 開屏自己的文件到齊了：守門從這時起算 app 該起來了
        // 「連接中」只在真的在連時說：app.js 跑起來了（設了 boot.locked）還沒好，就是在等服務器（回房間要先連上）。文件還在下的時候窗戶一扇扇亮，不用說
        if (!app && window.boot.locked && performance.now() > 15000) el.classList.add('slow');
        const ready = left <= 0 && app && !guard.blocked(); // 起不來的：停在小鎮上，守門那句話留著
        if (quiet) return ready && end();
        const played = art ? (performance.now() - t0) / MIN : 0;
        const want = art ? Math.ceil(lamps.length * Math.min(played, ready ? 1 : (all - Math.max(left, 0) - (app ? 0 : APP)) / all)) : 0;
        for (let n = ready ? 4 : 1; n-- && lit < want;) lamps[lit++][1].classList.add('on');
        const p = lit / lamps.length;
        minHand.style.transform = `rotate(${p * toMin}deg)`;
        hourHand.style.transform = `rotate(${p * toHour}deg)`;
        if (ready && (document.hidden || (played >= 1 && lit === lamps.length))) end();
      }, 18);
      window.boot = {
        out,
        ready() { app = true; guard.ready(); },
        css: Promise.all(CSS.map(n => new Promise(ok => {
          const l = document.createElement('link');
          l.rel = 'preload'; l.as = 'style'; l.href = `css/${n}.css`;
          l.onload = () => { l.onload = () => { got(); ok(); }; l.rel = 'stylesheet'; };
          l.onerror = () => { got(); ok(); };
          document.head.append(l);
        }))),
      };
      if (quiet) setTimeout(() => { quiet = false; delete root.dataset.boot; }, 2000);
      Promise.all([...el.querySelectorAll('img')].map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()))).then(() => { start(); el.classList.add('up'); if (!quiet) arm(); firstArt(); });
      setTimeout(() => { start(); pullJs(); }, 4000);
      setTimeout(() => { left = 0; }, 12000); // 圖片卡住也別一直攔著
      const title = load(`title-${lang}-plain`, () => { got(); el.classList.add('named'); firstArt(); });
      const stars = new Image();
      stars.onload = stars.onerror = () => { got(); el.classList.add('starry'); };
      stars.src = 'img/stars.svg';
      MUST.forEach(n => load(n, got));
      // 剩下的等第一屏到齊才在後台補齊（end），兩張兩張來，不和第一屏搶那點帶寬；停在點擊進入時也在補
      const rest = inRoom ? LATER : [...GAME, ...LATER];
      const more = () => { let i = 0; const next = () => { if (i < rest.length) load(rest[i++], next); }; next(); next(); };
      // 開屏裏沒有的雲、烏鴉、炊煙這時才登場（ambient.css）；演完去掉，之後再打開介紹接著同一片天，不重演
      out.then(() => { root.dataset.sky = 'in'; setTimeout(() => delete root.dataset.sky, 9000); });
    }
  </script>
  <script defer src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="js/app.js"></script>
